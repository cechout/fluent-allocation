# validates that a pull request actually compiles and follows the editorconfig before review
# builds the WinUI project only; the frozen WPF version 1 is no longer built here
name: pr build check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # build and format are required status checks on main, so this workflow has to report them on every pull
  # request, including doc-only ones
  #
  # paths-ignore cannot do that: a workflow skipped by path filtering never reports its checks at all, they
  # stay pending and the pull request can never be merged
  # a job skipped by an if condition does report, as success, so the gate has to sit on the jobs instead
  # https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/defining-the-mergeability-of-pull-requests/troubleshooting-required-status-checks
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # asks the api for the changed files instead of diffing a checkout, so there is no clone and no
      # guessing about how deep the history has to be fetched for a merge base
      #
      # every uncertain path sets code=true on purpose: a skipped job reports success, so guessing wrong
      # in the other direction would wave an unbuilt pull request through the required checks
      - name: check whether anything buildable changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename'); then
            echo "could not list the changed files, building anyway"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$changed"

          if [ -z "$changed" ]; then
            echo "no files reported, building anyway"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$changed" | grep -qvE '(\.md$|^\.github/ISSUE_TEMPLATE/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # only an explicit code=false skips the build; if the filter job itself failed the output is empty and
  # this still runs, so a broken filter costs a build rather than waving the pull request through
  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: FluentAllocation/FluentAllocation.csproj

      # always the project, never FluentAllocation.slnx, which also holds the WPF version 1
      # (WinUI 3 has no Any CPU, so every step names the platform)
      - name: restore
        run: dotnet restore FluentAllocation/FluentAllocation.csproj -p:Platform=x64 -r win-x64 -p:SelfContained=true

      # one full pass; the XAML compiler needs it before a publish can resolve x:Bind types
      - name: build win-x64
        run: dotnet build FluentAllocation/FluentAllocation.csproj --no-restore -c Release -p:Platform=x64 -r win-x64 -p:SelfContained=true

      # proves the publish path before a release depends on it; --no-build reuses the pass above
      - name: publish win-x64
        run: dotnet publish FluentAllocation/FluentAllocation.csproj --no-build -c Release -p:Platform=x64 -p:PublishProfile=win-x64

      # absolute numbers only; the ten largest files show where a jump comes from
      - name: report publish size
        shell: pwsh
        run: |
          $publishDir = "FluentAllocation/bin/x64/Release/net10.0-windows10.0.19041.0/publish/win-x64"
          $root = (Resolve-Path $publishDir).Path
          $files = Get-ChildItem $root -Recurse -File
          $total = ($files | Measure-Object -Property Length -Sum).Sum

          $lines = @()
          $lines += "## Publish payload"
          $lines += ""
          $lines += "Total: **$([math]::Round($total / 1MB, 2)) MB** across $($files.Count) files"
          $lines += ""
          $lines += "| Largest files | Size |"
          $lines += "| :--- | ---: |"
          foreach ($file in $files | Sort-Object Length -Descending | Select-Object -First 10)
          {
            $name = $file.FullName.Substring($root.Length + 1)
            $lines += "| $name | $([math]::Round($file.Length / 1MB, 2)) MB |"
          }

          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "Publish payload: $([math]::Round($total / 1MB, 2)) MB"

  # gated like the two around it; a required check only once it is added to the ruleset by hand
  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: FluentAllocation.Tests/FluentAllocation.Tests.csproj

      # plain net10.0, so neither a platform nor a runtime identifier
      - name: engine tests
        run: dotnet test FluentAllocation.Tests/FluentAllocation.Tests.csproj -c Release

  format:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # no cache here, unlike the build job, dotnet format whitespace does not
      # reliably populate the nuget packages folder the cache action expects to save
      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # scoped to whitespace only, matches the .editorconfig, not style/analyzers
      #
      # no -p:Platform here, dotnet format has no MSBuild property option and answers one with its
      # usage help and a non zero exit, so the check would never actually run
      #
      # end_of_line = lf only holds because .gitattributes pins the checkout to lf; without it the
      # runner default core.autocrlf=true hands out a crlf tree and every line fails
      - name: dotnet format whitespace check
        run: dotnet format whitespace FluentAllocation/FluentAllocation.csproj --verify-no-changes --verbosity diagnostic

      # the test sources against the same editorconfig
      - name: dotnet format whitespace check, tests
        run: dotnet format whitespace FluentAllocation.Tests/FluentAllocation.Tests.csproj --verify-no-changes --verbosity diagnostic
