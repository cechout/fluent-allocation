# security scanning via CodeQL, advanced setup with manual build mode
#
# manual rather than autobuild so the build is the same explicit one pr-build.yml runs; the WinUI project
# that follows cannot be built by autobuild at all (MarkupCompilePass2 needs a full Build pass to resolve
# x:Bind LocalAssembly types)
name: codeql

# codeql is not a required status check, so path filtering is safe here; skipping it on a doc-only change
# leaves nothing pending, unlike the build and format checks in pr-build.yml
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  schedule:
    - cron: "24 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: initialize codeql
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: restore
        run: dotnet restore Kurszuteilung/Kurszuteilung.csproj

      - name: build
        run: dotnet build Kurszuteilung/Kurszuteilung.csproj --no-restore -c Release

      - name: perform codeql analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
