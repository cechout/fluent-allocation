version: 2
updates:
  # scoped to the WinUI project and its tests; the WPF version 1 is kept as it was and gets no update pull requests
  - package-ecosystem: "nuget"
    directory: "/FluentAllocation"
    schedule:
      interval: "weekly"
    groups:
      # the deselected components pin the versions the metapackage pulls in, so they move with it
      windows-app-sdk:
        patterns:
          - "Microsoft.WindowsAppSDK*"
          - "Microsoft.Windows.AI.MachineLearning"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/FluentAllocation.Tests"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
